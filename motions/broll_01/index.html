<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      /* Estilo comum dos b-rolls */
      :root {
        --bg: #0b1d3a;
        --ink: #f5f7fa;
        --yellow: #ffc93c;
        --coral: #ff5a5f;
        --cyan: #2ec4f1;
        --font: "Montserrat", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #root { width: 100%; height: 100%; position: relative; font-family: var(--font); }
      #scene { position: absolute; inset: 0; transform: translateY(130px); }
      .glow { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.35; }

      /* Cena 1 */
      #g1 { left: 140px; top: 160px; width: 800px; height: 600px; background: #12407a; }
      #g2 { left: 90px; top: 900px; width: 900px; height: 500px; background: #102c55; }
      #brain { position: absolute; left: 310px; top: 210px; width: 460px; height: 460px; }
      #beam { position: absolute; left: 200px; top: 852px; width: 680px; height: 16px; border-radius: 8px; background: var(--ink); }
      #pivot { position: absolute; left: 518px; top: 838px; width: 44px; height: 44px; border-radius: 50%; background: var(--yellow); }
      #pole { position: absolute; left: 530px; top: 870px; width: 20px; height: 370px; background: var(--ink); border-radius: 6px; }
      #base { position: absolute; left: 380px; top: 1230px; width: 320px; height: 30px; border-radius: 15px; background: var(--ink); }
      .pan { position: absolute; top: 860px; width: 280px; height: 260px; }
      #panL { left: 80px; }
      #panR { left: 720px; }
      .pan svg { position: absolute; left: 0; top: 0; width: 280px; height: 260px; overflow: visible; }
      .book { position: absolute; left: 40px; width: 200px; height: 44px; border-radius: 6px; }
      .book::after { content: ""; position: absolute; left: 14px; right: 14px; top: 10px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.55); }
      #bk1 { top: 186px; background: var(--cyan); }
      #bk2 { top: 142px; background: var(--yellow); left: 30px; width: 220px; }
      #bk3 { top: 98px; background: var(--coral); left: 50px; width: 180px; }
      #cap { position: absolute; left: 50px; top: 8px; width: 180px; height: 90px; }
      #coin {
        position: absolute; left: 65px; top: 80px; width: 150px; height: 150px; border-radius: 50%;
        background: var(--yellow); border: 10px solid #e0a800;
        display: flex; align-items: center; justify-content: center;
        color: var(--bg); font-weight: 900; font-size: 44px; letter-spacing: -0.02em;
      }
      #ring { position: absolute; left: 40px; top: 55px; width: 200px; height: 200px; border-radius: 50%; border: 8px solid var(--coral); opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1080" data-height="1920">
      <div id="scene" class="clip" data-start="0" data-duration="6" data-track-index="0" data-track-kind="graphics" data-layout-allow-overlap>
        <div id="g1" class="glow"></div>
        <div id="g2" class="glow"></div>

        <!-- conhecimento: cabeça com rede neural -->
        <svg id="brain" viewBox="0 0 400 400">
          <circle cx="200" cy="200" r="180" fill="rgba(46,196,241,0.10)" stroke="#2ec4f1" stroke-width="10" />
          <g id="links" stroke="#2ec4f1" stroke-width="6" stroke-linecap="round" opacity="0.35">
            <line x1="120" y1="140" x2="200" y2="95" /><line x1="200" y1="95" x2="285" y2="145" />
            <line x1="120" y1="140" x2="150" y2="225" /><line x1="285" y1="145" x2="255" y2="230" />
            <line x1="150" y1="225" x2="255" y2="230" /><line x1="150" y1="225" x2="110" y2="285" />
            <line x1="255" y1="230" x2="300" y2="290" /><line x1="150" y1="225" x2="200" y2="305" />
            <line x1="255" y1="230" x2="200" y2="305" /><line x1="200" y1="95" x2="150" y2="225" />
          </g>
          <g id="nodes" fill="#ffc93c">
            <circle class="nd" cx="120" cy="140" r="18" /><circle class="nd" cx="200" cy="95" r="18" />
            <circle class="nd" cx="285" cy="145" r="18" /><circle class="nd" cx="150" cy="225" r="18" />
            <circle class="nd" cx="255" cy="230" r="18" /><circle class="nd" cx="110" cy="285" r="18" />
            <circle class="nd" cx="300" cy="290" r="18" /><circle class="nd" cx="200" cy="305" r="18" />
          </g>
        </svg>

        <!-- balança -->
        <div id="pole"></div>
        <div id="base"></div>
        <div id="beam"></div>
        <div id="pivot"></div>

        <div id="panL" class="pan">
          <svg viewBox="0 0 280 260">
            <line x1="140" y1="0" x2="12" y2="230" stroke="#f5f7fa" stroke-width="5" />
            <line x1="140" y1="0" x2="268" y2="230" stroke="#f5f7fa" stroke-width="5" />
            <path d="M0 230 Q140 310 280 230 Z" fill="#f5f7fa" />
          </svg>
          <div id="bk1" class="book"></div>
          <div id="bk2" class="book"></div>
          <div id="bk3" class="book"></div>
          <svg id="cap" viewBox="0 0 180 90">
            <polygon points="90,0 180,30 90,60 0,30" fill="#f5f7fa" />
            <rect x="50" y="40" width="80" height="40" rx="8" fill="#f5f7fa" />
            <line x1="150" y1="32" x2="150" y2="80" stroke="#ffc93c" stroke-width="6" />
            <circle cx="150" cy="84" r="7" fill="#ffc93c" />
          </svg>
        </div>

        <div id="panR" class="pan">
          <svg viewBox="0 0 280 260">
            <line x1="140" y1="0" x2="12" y2="230" stroke="#f5f7fa" stroke-width="5" />
            <line x1="140" y1="0" x2="268" y2="230" stroke="#f5f7fa" stroke-width="5" />
            <path d="M0 230 Q140 310 280 230 Z" fill="#f5f7fa" />
          </svg>
          <div id="ring"></div>
          <div id="coin">R$10</div>
        </div>
      </div>
        <!-- efeitos sonoros -->
      <audio id="sfx-brilho" class="clip" src="assets/sfx/sparkle.mp3" data-start="0.2" data-duration="1.8" data-volume="0.45" data-track-index="1"></audio>
      <audio id="sfx-livro1" class="clip" src="assets/sfx/livro-thud.wav" data-start="1.3" data-duration="0.35" data-volume="0.9" data-track-index="2"></audio>
      <audio id="sfx-livro2" class="clip" src="assets/sfx/livro-thud.wav" data-start="1.75" data-duration="0.35" data-volume="0.9" data-track-index="3"></audio>
      <audio id="sfx-livro3" class="clip" src="assets/sfx/livro-thud.wav" data-start="2.2" data-duration="0.35" data-volume="0.9" data-track-index="4"></audio>
      <audio id="sfx-capelo" class="clip" src="assets/sfx/livro-thud.wav" data-start="2.65" data-duration="0.35" data-volume="0.55" data-track-index="5"></audio>
      <audio id="sfx-queda-moeda" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="3.1" data-duration="0.57" data-volume="0.45" data-track-index="6"></audio>
      <audio id="sfx-moeda1" class="clip" src="assets/sfx/moeda-clink.wav" data-start="3.42" data-duration="0.7" data-volume="1.0" data-track-index="7"></audio>
      <audio id="sfx-moeda2" class="clip" src="assets/sfx/moeda-clink.wav" data-start="3.64" data-duration="0.7" data-volume="0.45" data-track-index="8"></audio>
      <audio id="sfx-moeda3" class="clip" src="assets/sfx/moeda-clink.wav" data-start="3.75" data-duration="0.7" data-volume="0.25" data-track-index="9"></audio>
      <audio id="sfx-alerta" class="clip" src="assets/sfx/error.mp3" data-start="4.4" data-duration="0.6" data-volume="0.7" data-media-start="0.55" data-track-index="10"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const rad = (d) => 320 * Math.sin((d * Math.PI) / 180);
      const tilt = (deg, at, dur) => {
        tl.to("#beam", { rotation: deg, duration: dur, ease: "back.out(2)" }, at);
        tl.to("#panL", { y: rad(-deg), duration: dur, ease: "back.out(2)" }, at);
        tl.to("#panR", { y: -rad(-deg), duration: dur, ease: "back.out(2)" }, at);
      };

      // cérebro acende
      tl.fromTo("#brain", { scale: 0.92 }, { scale: 1, duration: 0.8, ease: "power3.out" }, 0);
      tl.fromTo(".nd", { scale: 0.4, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.5, ease: "back.out(3)", stagger: 0.07 }, 0.1);
      tl.to("#links", { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.4);

      // anos de estudo empilhando no prato esquerdo
      const drops = ["#bk1", "#bk2", "#bk3", "#cap"];
      const tilts = [-4, -8, -11, -14];
      drops.forEach((sel, i) => {
        const at = 0.9 + i * 0.45;
        tl.fromTo(sel, { y: -1250 }, { y: 0, duration: 0.4, ease: "power3.in" }, at);
        tilt(tilts[i], at + 0.38, 0.45);
      });

      // a moeda cai e não pesa nada
      tl.fromTo("#coin", { y: -1300 }, { y: 0, duration: 0.6, ease: "bounce.out" }, 3.2);
      tilt(-12, 3.75, 0.2);
      tilt(-14, 3.95, 0.4);

      // destaque na moeda
      tl.fromTo("#ring", { scale: 0.6, opacity: 1 }, { scale: 1.8, opacity: 0, duration: 0.8, ease: "power2.out", immediateRender: false }, 4.4);
      tl.fromTo("#coin", { scale: 1 }, { scale: 1.18, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 1 }, 4.4);
      tl.to("#coin", { rotation: -8, duration: 0.6, ease: "sine.inOut" }, 5.0);
      tl.to("#brain", { scale: 1.04, duration: 1.2, ease: "sine.inOut" }, 4.6);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
