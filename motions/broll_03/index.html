<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      /* Estilo comum dos b-rolls */
      :root {
        --bg: #0b1d3a;
        --ink: #f5f7fa;
        --yellow: #ffc93c;
        --coral: #ff5a5f;
        --cyan: #2ec4f1;
        --panel: #10284d;
        --font: "Montserrat", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #root { width: 100%; height: 100%; position: relative; font-family: var(--font); }
      #scene { position: absolute; inset: 0; transform: translateY(60px); }
      .glow { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.35; }

      /* Cena 3 */
      #g1 { left: 140px; top: 650px; width: 800px; height: 600px; background: #12407a; }
      .card { position: absolute; top: 180px; width: 300px; height: 300px; border-radius: 40px; background: var(--panel); border: 6px solid var(--cyan); }
      #cardH { left: 160px; border-color: var(--coral); }
      #cardM { left: 620px; }
      .card svg { position: absolute; left: 50px; top: 50px; width: 188px; height: 188px; }
      #ecgWin { position: absolute; left: 0; top: 520px; width: 1080px; height: 120px; overflow: hidden; }
      #ecg { position: absolute; left: 0; top: 0; width: 1080px; height: 120px; }
      #calWrap { position: absolute; left: 280px; top: 720px; width: 520px; height: 480px; }
      #cal { position: absolute; left: 0; top: 0; width: 520px; height: 480px; border-radius: 40px; background: var(--ink); overflow: hidden; }
      #calHead { position: absolute; left: 0; top: 0; width: 520px; height: 140px; background: #d62839; }
      #month { position: absolute; left: 0; top: 0; width: 520px; height: 140px; line-height: 140px; text-align: center; color: var(--ink); font-weight: 900; font-size: 84px; letter-spacing: 0.04em; }
      #year { position: absolute; left: 0; top: 190px; width: 520px; text-align: center; color: var(--bg); font-weight: 900; font-size: 150px; letter-spacing: -0.03em; line-height: 1; }
      .rings { position: absolute; top: -18px; width: 22px; height: 60px; border-radius: 11px; background: var(--bg); }
      #r1 { left: 120px; } #r2 { left: 378px; }
      #days { position: absolute; left: 50px; top: 390px; width: 420px; height: 40px; display: flex; gap: 14px; }
      #days span { flex: 1; border-radius: 10px; background: #d5dbe5; }
      #clock { position: absolute; left: 715px; top: 640px; width: 160px; height: 160px; border-radius: 50%; background: var(--ink); border: 12px solid var(--yellow); }
      #hand { position: absolute; left: 63px; top: 18px; width: 10px; height: 52px; border-radius: 5px; background: var(--bg); }
      #hand2 { position: absolute; left: 64px; top: 38px; width: 8px; height: 32px; border-radius: 4px; background: var(--coral); }
      #pin { position: absolute; left: 58px; top: 58px; width: 20px; height: 20px; border-radius: 50%; background: var(--bg); }
      #track { position: absolute; left: 140px; top: 1270px; width: 800px; height: 40px; border-radius: 20px; background: var(--panel); border: 5px solid var(--cyan); overflow: hidden; }
      #fill { position: absolute; left: 0; top: 0; width: 790px; height: 30px; background: var(--yellow); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="9" data-width="1080" data-height="1920">
      <div id="scene" class="clip" data-start="0" data-duration="9" data-track-index="0" data-track-kind="graphics" data-layout-allow-overlap data-layout-allow-overflow>
        <div id="g1" class="glow"></div>

        <!-- exame cardiológico -->
        <div id="cardH" class="card">
          <svg id="heart" viewBox="0 0 100 100">
            <path d="M50 88 C20 66 5 49 5 31 A22 22 0 0 1 50 22 A22 22 0 0 1 95 31 C95 49 80 66 50 88 Z" fill="#ff5a5f" />
          </svg>
        </div>
        <!-- exame de imagem -->
        <div id="cardM" class="card">
          <svg viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="36" fill="none" stroke="#2ec4f1" stroke-width="14" />
            <g id="scan"><circle cx="50" cy="50" r="22" fill="none" stroke="#ffc93c" stroke-width="5" stroke-dasharray="10 8" /></g>
            <rect id="bed" x="2" y="60" width="96" height="10" rx="5" fill="#f5f7fa" />
          </svg>
        </div>

        <div id="ecgWin">
          <svg id="ecg" viewBox="0 0 1080 120">
            <polyline points="0,60 280,60 320,60 350,12 385,110 420,60 520,60 600,60 630,18 665,104 700,60 1080,60" fill="none" stroke="#2ec4f1" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" />
          </svg>
        </div>

        <!-- o tempo passando -->
        <div id="calWrap">
        <div id="cal">
          <div id="calHead"></div>
          <div id="month">JAN</div>
          <div id="year">2026</div>
          <div id="days"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
        </div>
        <div id="r1" class="rings"></div>
        <div id="r2" class="rings"></div>
        </div>
        <div id="clock"><div id="hand"></div><div id="hand2"></div><div id="pin"></div></div>

        <div id="track"><div id="fill"></div></div>
      </div>
        <!-- efeitos sonoros -->
      <audio id="sfx-coracao" class="clip" src="assets/sfx/coracao.wav" data-start="0" data-duration="9" data-volume="0.9" data-track-index="1"></audio>
      <audio id="sfx-monitor" class="clip" src="assets/sfx/monitor-bipe.wav" data-start="0" data-duration="9" data-volume="0.22" data-track-index="2"></audio>
      <audio id="sfx-tomografo" class="clip" src="assets/sfx/tomografo-hum.wav" data-start="0" data-duration="9" data-volume="0.12" data-track-index="3" data-fade-in="0.3" data-fade-out="0.5"></audio>
      <audio id="sfx-calendario-entra" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="0.85" data-duration="0.57" data-volume="0.5" data-track-index="4"></audio>
      <audio id="sfx-relogio-entra" class="clip" src="assets/sfx/pop.mp3" data-start="1.3" data-duration="0.72" data-volume="0.6" data-track-index="5"></audio>
      <audio id="sfx-folhas" class="clip" src="assets/sfx/calendario-folhas.wav" data-start="2.1" data-duration="5.8" data-volume="0.6" data-track-index="6"></audio>
      <audio id="sfx-tique" class="clip" src="assets/sfx/relogio-tique.wav" data-start="2.1" data-duration="5.8" data-volume="0.4" data-track-index="7"></audio>
      <audio id="sfx-alerta" class="clip" src="assets/sfx/error.mp3" data-start="7.7" data-duration="0.6" data-volume="0.7" data-media-start="0.55" data-track-index="8"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const MESES = ["JAN", "FEV", "MAR", "ABR", "MAI", "JUN", "JUL", "AGO", "SET", "OUT", "NOV", "DEZ"];
      const monthEl = document.getElementById("month");
      const yearEl = document.getElementById("year");
      const cal = { m: 0 };
      const paint = () => {
        const i = Math.floor(cal.m);
        monthEl.textContent = MESES[i % 12];
        yearEl.textContent = String(2026 + Math.floor(i / 12));
      };


      // batimentos do coração (um por ~0,8 s)
      for (let t = 0.1; t < 8.8; t += 0.8) {
        tl.fromTo("#heart", { scale: 1 }, { scale: 1.16, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1, transformOrigin: "50% 50%", immediateRender: false }, t);
      }
      // ECG desenhando
      tl.fromTo("#ecgWin", { x: -900 }, { x: 0, duration: 1.6, ease: "none" }, 0);
      tl.fromTo("#ecg", { x: 900 }, { x: 0, duration: 1.6, ease: "none" }, 0);
      // tomógrafo: anel girando, maca entrando
      tl.fromTo("#scan", { rotation: 0, svgOrigin: "50 50" }, { rotation: 360 * 4, svgOrigin: "50 50", duration: 9, ease: "none" }, 0);
      tl.fromTo("#bed", { x: -60 }, { x: 0, duration: 1.0, ease: "power3.out" }, 0.2);

      // calendário e relógio entram
      tl.fromTo("#calWrap", { scale: 0.7, y: 80 }, { scale: 1, y: 0, duration: 0.6, ease: "back.out(1.8)" }, 0.9);
      tl.fromTo("#clock", { scale: 0 }, { scale: 1, duration: 0.5, ease: "back.out(2.5)" }, 1.3);
      tl.fromTo("#fill", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 0.03, duration: 0.6, ease: "power2.out" }, 1.5);

      // meses e anos passando cada vez mais rápido
      tl.to(cal, { m: 31, duration: 5.6, ease: "power2.in", onUpdate: paint }, 2.1);
      tl.to("#hand", { rotation: 360 * 3, transformOrigin: "50% 100%", duration: 5.6, ease: "power2.in" }, 2.1);
      tl.to("#hand2", { rotation: 360 * 14, transformOrigin: "50% 100%", duration: 5.6, ease: "power2.in" }, 2.1);
      tl.to("#fill", { scaleX: 0.07, duration: 6.4, ease: "none" }, 2.1);

      // e a fila quase não andou
      tl.to("#year", { color: "#d62839", duration: 0.3, ease: "power2.out" }, 7.7);
      tl.fromTo("#calWrap", { rotation: 0 }, { rotation: -3, duration: 0.08, ease: "sine.inOut", yoyo: true, repeat: 5, immediateRender: false }, 7.7);
      tl.fromTo("#clock", { scale: 1 }, { scale: 1.15, duration: 0.2, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, 7.8);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
